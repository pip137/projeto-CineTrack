<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Filme CineTrack</title>
    <link rel="stylesheet" href="cinetrack-css/style.css">
</head>
<body>
    <header>
        <h1>Editar filme</h1>
        <a href="index.html"><button>Voltar</button></a>
    </header>
        
    <main>
        <form class="form-adicionar" id ="form-filme"> 
            <div class="card-adicionar">
                <label for="titulo">Título</label>
                <input id="titulo" name="titulo" type="text" required>
            </div>

            <div class="card-adicionar">
                <label for="ano">Ano</label>
                <input id="ano" name="ano" type="number" min="1888" max="2030" required>
            </div>

            <div class="card-adicionar">
                <label for="genero">Gênero</label>
                <input id="genero" name="genero" type="text" required>
            </div>

            <div class="card-adicionar">
                <label for="url">URL do Pôster</label>
                <input id="url" name="url" type="text">
            </div>

            <div class="card-adicionar">
                <label for="status">Status:</label>
                <select id="status" name="status" required>
                    <option value="ativo">Assistido</option>
                    <option value="pendente">Assistindo</option>
                    <option value="inativo">Quero assistir</option>
                </select>
            </div>

            <div class="card-adicionar">
                <label for="nota">Nota</label>
                <input id="nota" name="nota" type="number" min="1" max="5">
            </div>

            <div class="card-adicionar">
                <label for="comentario">Comentário</label>
                <textarea id="comentario" name="comentario"></textarea>
            </div>

            <nav class="nav-adicionar">
                <button>Salvar</button>
                <button>Cancelar</button>
            </nav>
        </form>
    </main>

    <footer>
        <div class="direitos">
            <small>CineTrack - UEM | Direitos &copy; 2026</small>
            <a href="sobre.html">Sobre o CineTrack</a>
        </div>
    </footer>
</body>
</html>
